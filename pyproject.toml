[project]
name = "palestra-function-calling"
version = "0.1.0"
description = "Selfwork Functions Calling: chatbot della palestra PowerGym con Chainlit e function calling"
authors = [
    {name = "Giuseppe Giannelli", email = "peppegiannelli@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chainlit (>=2.12.0,<3.0.0)",
    "openai (>=3.0.0,<4.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
